# Render Blueprint: API + free Postgres. The dashboard goes on Vercel (see DEPLOY.md).
databases:
  - name: shapater-db
    plan: free
    databaseName: shapater
    user: shapater

services:
  - type: web
    name: shapater-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: shapater-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEYS      # you must paste a Fernet key here (see DEPLOY.md)
        sync: false
      - key: CORS_ORIGINS         # JSON list with your Vercel URL, e.g. ["https://shapater.vercel.app"]
        sync: false
